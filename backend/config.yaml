ai:
  provider: "${AI_PROVIDER}"  # azure | gemini (empty = azure)
  model_deployment: "${MODEL_DEPLOYMENT}"  # default model for all roles
  models:  # optional per-function overrides — each falls back to model_deployment
    monitor_assessment: "gpt-5.4"
    monitor_roll: "gpt-5.4"
    supervisor: "gpt-5.4-mini"
    alpha: "gpt-5.4-mini"
    analysis: "gpt-5.4"
    buy_tracker: "gpt-5.4-mini"
    summary: "gpt-5.4-mini"
    banner: "gpt-5.4-mini"
    report: "gpt-5.4-mini"
    chat: "gpt-5.4-mini"
    symbol_chat: "gpt-5.4-mini"

azure:
  project_endpoint: "${AZURE_AI_PROJECT_ENDPOINT}"
  api_key: "${AZURE_OPENAI_API_KEY}"

gemini:
  api_key: "${GOOGLE_API_KEY}"

cosmosdb:
  endpoint: "${COSMOSDB_ENDPOINT}"
  key: "${COSMOSDB_KEY}"
  database: "stock-options-manager"

context:
  max_activity_entries: 2   # Recent activities to inject as agent context (0=none, max 5). Each includes its alert if actionable.
  activity_ttl_days: 90     # Activities older than this are auto-expired via CosmosDB TTL

scheduler:
  cron: "30 9-16/4 * * 1-5"  # Cron expression: every 4 hours starting at 9:30, market hours Mon-Fri
  timezone: "UTC"  # Timezone for scheduler (container default)

web:
  host: "0.0.0.0"
  port: 8000

telegram:
  enabled: false
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

summary_agent:
  enabled: true
  cron: "0 8 * * *"  # 8 AM daily (UTC)
  activity_count: 3  # Latest N activities per symbol

plan_monitor:
  enabled: true
  cron: "0 4,16 * * 1-5"  # 4 AM and 4 PM weekdays (UTC)
  model: "gpt-5.4-mini"

banner_agent:
  enabled: true
  cron: "0 5 * * *"  # 5 AM daily
  max_items: 10

dps_scorer:
  enabled: true
  cron: "0 22 * * 1-5"  # 10 PM weekdays (UTC)

options_chain_scheduler:
  enabled: true
  cron: "0 * * * *"  # Every hour

# Persistent options chain cache (accumulate-and-merge design, 2026-08-18).
# See src/options_chain_cache.py and src/options_chain_store.py.
options_chain_cache:
  ttl_seconds: 1800              # Freshness only — never deletes contracts.
  persistence_enabled: true      # false => today's pure memory-only behavior.
  expired_shard_grace_days: 7    # Days past actual expiration (America/New_York)
                                  # before a persisted shard is deleted.
  max_shard_bytes: 1600000       # Escape valve, under Cosmos's 2MB item limit.
  stale_quote_warn_seconds: 86400  # Wired (2026-08-19 zero-free decision §4.3):
                                  # single input to `_meta.stale` in
                                  # options_chain_view.to_agent_view and to the
                                  # per-refresh "contracts_stale" quality counter.
  persistence_retry_seconds: 300   # Base backoff before retrying shared-store
                                  # construction after a *transient* failure
                                  # (unreachable Cosmos, config-load hiccup) —
                                  # doubles per consecutive failure, capped at
                                  # 3600s. Does not apply to an explicit
                                  # persistence_enabled: false, which is
                                  # terminal (never retried). See
                                  # src/options_chain_store.py get_options_chain_store().

portfolio_enrichment:
  enabled: true
  cron: "0 9-17 * * 1-5"  # Hourly 9-17 Mon-Fri (UTC)

price_forecast:
  enabled: true
  cron: "0 21 * * 1-5"  # 9 PM weekdays (UTC) — after US market close

best_options_scheduler:
  enabled: true
  cron: "5 10-23 * * 1-5"  # Hourly at :05, 10:05–23:05, weekdays (container timezone)
  run_on_startup: true

# yfinance data provider settings
yfinance:
  cache_ttl: 300             # Cache TTL in seconds (default: 5 minutes)
  rate_limit:
    calls_per_second: 2      # Max yfinance API calls per second
  randomize_symbols: true    # Shuffle symbol order to vary processing

