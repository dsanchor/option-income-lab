name: Build and Push Docker Images

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: front
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value={{branch}}-{{sha}},enable=true
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for azure/login
      contents: read
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue; do not cancel running deploys

    steps:
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(echo '${{ github.sha }}' | head -c 7)" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Container Apps
        id: deploy-api
        run: |
          REVISION=$(az containerapp update \
            --name ca-stock-options-manager-api \
            --resource-group stock-options-manager-rg \
            --image ghcr.io/dsanchor/option-income-lab-api:${{ steps.tag.outputs.tag }} \
            --query "properties.latestRevisionName" -o tsv)
          if [ -z "$REVISION" ]; then
            echo "❌ Could not determine revision name from az containerapp update output"
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "API revision: $REVISION"

      - name: Verify API revision is ready
        run: |
          REVISION="${{ steps.deploy-api.outputs.revision }}"
          echo "Polling revision: $REVISION"
          PROV="Unknown"; HEALTH="Unknown"; ACTIVE="false"
          for i in $(seq 1 30); do
            JSON=$(az containerapp revision show \
              --name ca-stock-options-manager-api \
              --resource-group stock-options-manager-rg \
              --revision "$REVISION" \
              -o json 2>/dev/null || echo "{}")
            PROV=$(echo "$JSON" | jq -r '.properties.runningState // "Unknown"')
            HEALTH=$(echo "$JSON" | jq -r '.properties.healthState // "Unknown"')
            ACTIVE=$(echo "$JSON" | jq -r '.properties.active // false')
            echo "Attempt $i/30 — runningState: $PROV  healthState: $HEALTH  active: $ACTIVE"
            if [ "$HEALTH" = "Healthy" ] && [ "$ACTIVE" = "true" ]; then
              echo "✅ API revision is healthy and active"
              break
            elif [ "$HEALTH" = "Unhealthy" ]; then
              echo "❌ API revision is unhealthy"
              exit 1
            elif [ "$PROV" = "Failed" ] || [ "$PROV" = "Degraded" ] || [ "$PROV" = "ProvisionFailed" ] || [ "$PROV" = "ActivationFailed" ]; then
              echo "❌ API revision provisioning failed (runningState: $PROV)"
              exit 1
            fi
            sleep 10
          done
          if [ "$HEALTH" != "Healthy" ] || [ "$ACTIVE" != "true" ]; then
            echo "❌ API revision did not become healthy within 5 minutes (runningState: $PROV  healthState: $HEALTH  active: $ACTIVE)"
            exit 1
          fi

      - name: Deploy Frontend to Container Apps
        id: deploy-front
        run: |
          REVISION=$(az containerapp update \
            --name ca-stock-options-manager-front \
            --resource-group stock-options-manager-rg \
            --image ghcr.io/dsanchor/option-income-lab-front:${{ steps.tag.outputs.tag }} \
            --query "properties.latestRevisionName" -o tsv)
          if [ -z "$REVISION" ]; then
            echo "❌ Could not determine revision name from az containerapp update output"
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Frontend revision: $REVISION"

      - name: Verify Frontend revision is ready
        run: |
          REVISION="${{ steps.deploy-front.outputs.revision }}"
          echo "Polling revision: $REVISION"
          PROV="Unknown"; HEALTH="Unknown"; ACTIVE="false"
          for i in $(seq 1 30); do
            JSON=$(az containerapp revision show \
              --name ca-stock-options-manager-front \
              --resource-group stock-options-manager-rg \
              --revision "$REVISION" \
              -o json 2>/dev/null || echo "{}")
            PROV=$(echo "$JSON" | jq -r '.properties.runningState // "Unknown"')
            HEALTH=$(echo "$JSON" | jq -r '.properties.healthState // "Unknown"')
            ACTIVE=$(echo "$JSON" | jq -r '.properties.active // false')
            echo "Attempt $i/30 — runningState: $PROV  healthState: $HEALTH  active: $ACTIVE"
            if [ "$HEALTH" = "Healthy" ] && [ "$ACTIVE" = "true" ]; then
              echo "✅ Frontend revision is healthy and active"
              break
            elif [ "$HEALTH" = "Unhealthy" ]; then
              echo "❌ Frontend revision is unhealthy"
              exit 1
            elif [ "$PROV" = "Failed" ] || [ "$PROV" = "Degraded" ] || [ "$PROV" = "ProvisionFailed" ] || [ "$PROV" = "ActivationFailed" ]; then
              echo "❌ Frontend revision provisioning failed (runningState: $PROV)"
              exit 1
            fi
            sleep 10
          done
          if [ "$HEALTH" != "Healthy" ] || [ "$ACTIVE" != "true" ]; then
            echo "❌ Frontend revision did not become healthy within 5 minutes (runningState: $PROV  healthState: $HEALTH  active: $ACTIVE)"
            exit 1
          fi

      - name: Update backup Job image when configured
        run: |
          set -euo pipefail
          JOB_NAME="ca-stock-options-manager-backup"
          RESOURCE_GROUP="stock-options-manager-rg"
          IMAGE="ghcr.io/dsanchor/option-income-lab-api:${{ steps.tag.outputs.tag }}"
          if ! az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            -o none 2>/dev/null; then
            echo "::notice::Optional backup Job '$JOB_NAME' is not configured; skipping its image update."
            exit 0
          fi
          BEFORE=$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            -o json)
          CONFIGURED_CLIENT_ID=$(jq -r \
            '[.properties.template.containers[].env[]? | select(.name == "AZURE_CLIENT_ID") | .value][0] // ""' \
            <<<"$BEFORE")
          mapfile -t IDENTITY_RESOURCE_IDS < <(
            jq -r '.identity.userAssignedIdentities // {} | keys[]' <<<"$BEFORE"
          )
          if [ "${#IDENTITY_RESOURCE_IDS[@]}" -eq 0 ] || [ -z "$CONFIGURED_CLIENT_ID" ]; then
            echo "❌ Backup Job must have a user-assigned identity and AZURE_CLIENT_ID."
            echo "Run backend/scripts/configure-backup.sh before enabling workflow image updates."
            exit 1
          fi
          IDENTITY_MATCHED=false
          for IDENTITY_RESOURCE_ID in "${IDENTITY_RESOURCE_IDS[@]}"; do
            ACTUAL_CLIENT_ID=$(az identity show \
              --ids "$IDENTITY_RESOURCE_ID" \
              --query clientId \
              --only-show-errors \
              -o tsv)
            if [ "$CONFIGURED_CLIENT_ID" = "$ACTUAL_CLIENT_ID" ]; then
              IDENTITY_MATCHED=true
              break
            fi
          done
          if [ "$IDENTITY_MATCHED" != true ]; then
            echo "❌ Backup Job AZURE_CLIENT_ID does not select its assigned identity."
            exit 1
          fi
          ENV_BEFORE_HASH=$(jq -cS \
            '[.properties.template.containers[].env[]?] | sort_by(.name)' \
            <<<"$BEFORE" | sha256sum | cut -d' ' -f1)
          IDENTITIES_BEFORE_HASH=$(jq -cS \
            '.identity.userAssignedIdentities' \
            <<<"$BEFORE" | sha256sum | cut -d' ' -f1)
          az containerapp job update \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --only-show-errors \
            -o none
          AFTER=$(az containerapp job show \
            --name "$JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --only-show-errors \
            -o json)
          DEPLOYED_IMAGE=$(jq -r '.properties.template.containers[0].image' <<<"$AFTER")
          if [ "$DEPLOYED_IMAGE" != "$IMAGE" ]; then
            echo "❌ Backup Job image verification failed"
            exit 1
          fi
          ENV_AFTER_HASH=$(jq -cS \
            '[.properties.template.containers[].env[]?] | sort_by(.name)' \
            <<<"$AFTER" | sha256sum | cut -d' ' -f1)
          IDENTITIES_AFTER_HASH=$(jq -cS \
            '.identity.userAssignedIdentities' \
            <<<"$AFTER" | sha256sum | cut -d' ' -f1)
          if [ "$ENV_BEFORE_HASH" != "$ENV_AFTER_HASH" ] ||
             [ "$IDENTITIES_BEFORE_HASH" != "$IDENTITIES_AFTER_HASH" ]; then
            echo "❌ Backup Job image update changed runtime environment or identity configuration"
            exit 1
          fi
          echo "✅ Backup Job uses the deployed immutable backend image"

      - name: Azure Logout
        if: always()
        run: az logout || true
